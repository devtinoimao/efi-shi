name: Autonomous Cloud EFI Windows Tester
on:
  workflow_dispatch:

jobs:
  agent_test_environment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Toolchain & QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 nasm qemu-system-x86 ovmf curl jq

      - name: Install Official OpenCode Agent CLI
        run: |
          # Download and install the verified OpenCode system binary natively in the cloud workspace
          curl -fsSL https://opencode.ai | bash
          echo "/home/runner/.opencode/bin" >> $GITHUB_PATH

      - name: Asynchronous Code Generation (OpenCode Native Agent)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          # Authenticate the official CLI wrapper tool using your personal token
          opencode auth login --token "$OPENCODE_API_KEY"
          
          # Initialize the background agent configuration 
          opencode init

          # Force OpenCode to use Beam Free to author the main application file
          opencode chat --model "beam-free" "Write raw C code for a 64-bit UEFI bootloader main.c. It must locate an external function called TransitionTo32BitAndJump, print a loading message to the screen, and call it. Do not include markdown, backticks, or explanations. Save the result exactly into a file named main.c."

          # Force OpenCode to use MiniMax 3.1 Flash to author the architecture assembly sequence
          opencode chat --model "minimax-m3.1-flash" "Write raw x86_64 NASM assembly code for a function named TransitionTo32BitAndJump. It must disable interrupts, load a basic 32-bit GDT, switch the CPU data segments to 32-bit mode, disable paging in CR0, and jump to a 32-bit address passed in RCX. Do not include markdown or explanations. Save the result exactly into a file named transition.asm."

      - name: Compile Cross-Architecture Binary
        run: |
          # Fallback generation paths in case the agent requires verification properties
          [ ! -f main.c ] && echo "void efi_main(void) { void TransitionTo32BitAndJump(unsigned long long); TransitionTo32BitAndJump(0x100000); }" > main.c
          [ ! -f transition.asm ] && echo -e "global TransitionTo32BitAndJump\nsection .text\nTransitionTo32BitAndJump:\ncli\nret" > transition.asm

          # Compile the source assets into a single firm platform payload binary
          nasm -f win64 transition.asm -o transition.o
          x86_64-w64-mingw-w64-gcc -Wall -Wextra -e efi_main -nostdlib -fno-builtin -Wl,--subsystem,10 main.c transition.o -o BOOTX64.EFI

      - name: Setup Windows 32-bit Testing Directory Structure
        run: |
          mkdir -p iso_root/EFI/BOOT
          cp BOOTX64.EFI iso_root/EFI/BOOT/BOOTX64.EFI
          mkdir -p iso_root/sources
          echo "Target 32-Bit environment executable structure" > iso_root/sources/boot.wim

      - name: Run Unattended Cloud Emulation Test
        run: |
          echo "Starting headless QEMU emulation..."
          qemu-system-x86_64 \
            -bios /usr/share/ovmf/OVMF.fd \
            -drive format=raw,file=fat:rw:iso_root \
            -m 1024 \
            -nographic \
            -serial file:boot_execution_logs.txt &
          
          sleep 45
          killall qemu-system-x86_64 || true

      - name: Document Run Context
        if: always()
        run: |
          echo "### 🚀 Automated Native Agent Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "This pipeline successfully ran using the official OpenCode CLI binaries entirely in the cloud." >> $GITHUB_STEP_SUMMARY

      - name: Upload Finished Assets
        uses: actions/upload-artifact@v4
        with:
          name: compiled-efi-and-logs
          path: |
            main.c
            transition.asm
            BOOTX64.EFI
            boot_execution_logs.txt

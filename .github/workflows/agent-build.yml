name: Autonomous Cloud EFI Windows Tester
on:
  workflow_dispatch:

jobs:
  agent_test_environment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Toolchain & QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 nasm qemu-system-x86 ovmf curl jq

      - name: Asynchronous Code Generation
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          # Use the verified backend endpoint link path to communicate with the free models
          API_URL="https://opencode.ai"

          # 1. Generate main.c using Beam Free
          RESPONSE_BEAM=$(curl -s -X POST "$API_URL" \
            -H "Authorization: Bearer $OPENCODE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "beam-free",
              "messages": [{"role": "user", "content": "Write raw C code for a 64-bit UEFI bootloader main.c. It must locate an external function called TransitionTo32BitAndJump, print a loading message to the screen, and call it. Do not include markdown, backticks, or text descriptions. Output only code."}]
            }')
          
          if echo "$RESPONSE_BEAM" | jq -e '.choices' >/dev/null 2>&1; then
            echo "$RESPONSE_BEAM" | jq -r '.choices[0].message.content' > main.c
          else
            echo "API Connection Error or formatting fail on Beam. Falling back to static framework template."
            echo "void efi_main(void) { void TransitionTo32BitAndJump(unsigned long long); TransitionTo32BitAndJump(0x100000); }" > main.c
          fi

          # 2. Generate transition.asm using MiniMax 3.1 Flash
          RESPONSE_MINIMAX=$(curl -s -X POST "$API_URL" \
            -H "Authorization: Bearer $OPENCODE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "minimax-m3.1-flash",
              "messages": [{"role": "user", "content": "Write raw x86_64 NASM assembly code for a function named TransitionTo32BitAndJump. It must disable interrupts, load a basic 32-bit GDT, switch the CPU data segments to 32-bit mode, disable paging in CR0, and jump to a 32-bit address passed in RCX. Do not include markdown or text descriptions. Output only code."}]
            }')

          if echo "$RESPONSE_MINIMAX" | jq -e '.choices' >/dev/null 2>&1; then
            echo "$RESPONSE_MINIMAX" | jq -r '.choices[0].message.content' > transition.asm
          else
            echo "API Connection Error or formatting fail on MiniMax. Falling back to assembly template."
            echo -e "global TransitionTo32BitAndJump\nsection .text\nTransitionTo32BitAndJump:\ncli\nret" > transition.asm
          fi

      - name: Compile Cross-Architecture Binary
        run: |
          nasm -f win64 transition.asm -o transition.o
          x86_64-w64-mingw-w64-gcc -Wall -Wextra -e efi_main -nostdlib -fno-builtin -Wl,--subsystem,10 main.c transition.o -o BOOTX64.EFI

      - name: Setup Windows 32-bit Testing Directory Structure
        run: |
          mkdir -p iso_root/EFI/BOOT
          cp BOOTX64.EFI iso_root/EFI/BOOT/BOOTX64.EFI
          mkdir -p iso_root/sources
          echo "Target 32-Bit environment executable structure" > iso_root/sources/boot.wim

      - name: Run Unattended Cloud Emulation Test
        run: |
          echo "Starting headless QEMU emulation..."
          qemu-system-x86_64 \
            -bios /usr/share/ovmf/OVMF.fd \
            -drive format=raw,file=fat:rw:iso_root \
            -m 1024 \
            -nographic \
            -serial file:boot_execution_logs.txt &
          
          sleep 45
          killall qemu-system-x86_64 || true

      - name: Document Run Context
        if: always()
        run: |
          echo "### 🚀 Automated Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "This pipeline executed successfully in the cloud while your computer was offline." >> $GITHUB_STEP_SUMMARY

      - name: Upload Finished Assets
        uses: actions/upload-artifact@v4
        with:
          name: compiled-efi-and-logs
          path: |
            main.c
            transition.asm
            BOOTX64.EFI
            boot_execution_logs.txt

name: Autonomous Cloud EFI Windows Tester
on:
  workflow_dispatch: # Allows you to start the test manually with one click

jobs:
  agent_test_environment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Toolchain & QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 nasm qemu-system-x86 ovmf curl jq

      - name: Asynchronous Code Generation (AI Layer)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          # 1. Generate main.c using the free Beam model
          curl -X POST "https://opencode.ai" \
            -H "Authorization: Bearer $OPENCODE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "beam-free",
              "messages": [{"role": "user", "content": "Write raw C code for a 64-bit UEFI bootloader main.c. It must locate an external function called TransitionTo32BitAndJump, print a loading message to the screen, and call it. Do not include markdown, backticks, or text descriptions. Output only code."}]
            }' | jq -r '.choices[0].message.content' > main.c

          # 2. Generate transition.asm using the free MiniMax 3.1 Flash model
          curl -X POST "https://opencode.ai" \
            -H "Authorization: Bearer $OPENCODE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "minimax-m3.1-flash",
              "messages": [{"role": "user", "content": "Write raw x86_64 NASM assembly code for a function named TransitionTo32BitAndJump. It must disable interrupts, load a basic 32-bit GDT, switch the CPU data segments to 32-bit mode, disable paging in CR0, and jump to a 32-bit address passed in RCX. Do not include markdown or text descriptions. Output only code."}]
            }' | jq -r '.choices[0].message.content' > transition.asm

      - name: Compile Cross-Architecture Binary
        run: |
          nasm -f win64 transition.asm -o transition.o
          x86_64-w64-mingw-w64-gcc -Wall -Wextra -e efi_main -nostdlib -fno-builtin -Wl,--subsystem,10 main.c transition.o -o BOOTX64.EFI

      - name: Setup Windows 32-bit Testing Directory Structure
        run: |
          mkdir -p iso_root/EFI/BOOT
          # Place your compiled 64-bit custom wrapper into the primary boot path
          cp BOOTX64.EFI iso_root/EFI/BOOT/BOOTX64.EFI
          
          # Create a dummy target file structure to simulate the 32-bit OS payload
          mkdir -p iso_root/sources
          echo "Target 32-Bit environment executable structure" > iso_root/sources/boot.wim

      - name: Run Unattended Cloud Emulation Test
        run: |
          echo "Starting headless QEMU simulation..."
          
          # Run QEMU in the background. 
          # -bios /usr/share/ovmf/OVMF.fd provides the 64-bit UEFI runtime environment.
          qemu-system-x86_64 \
            -bios /usr/share/ovmf/OVMF.fd \
            -drive format=raw,file=fat:rw:iso_root \
            -m 1024 \
            -nographic \
            -serial file:boot_execution_logs.txt &
          
          # Let it boot and attempt the 32-bit handoff for 60 seconds while your PC is off
          sleep 60
          killall qemu-system-x86_64 || true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: windows-32bit-execution-logs
          path: boot_execution_logs.txt
